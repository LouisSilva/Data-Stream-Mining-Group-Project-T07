models:
  ENF_Unim_Safe:
    kind: nf
    import: src.baseline.ENF_UnimNeuron_Safe:EvolvingNeuroFuzzyUnimSafe
    parameters:
      max_rules: 5
      safe_threshold: 0.07
      min_firing_for_update: 0.05
      tau_merge: 0.62
      drift_sensitivity: 0.35
      
  ENF_Unim_Safe_Local:
    kind: nf
    import: src.proposed.ENF_UnimNeuron_Safe_Local:EvolvingNeuroFuzzyUnimSafeLocal
    parameters:
      max_rules: 5
      safe_threshold: 0.07
      min_firing_for_update: 0.05
      tau_merge: 0.62
      drift_sensitivity: 0.35
      
  ENF_Unim_PA:
    kind: nf
    import: src.baseline.ENF_UnimNeuron_PA:EvolvingNeuroFuzzyUnimPA
    parameters:
      max_rules: 5
      C: 0.25
      use_PA_I: true
      margin_threshold: 0.8
      decay_rate: 0.01
      tau_merge: 0.68
      
  ePL:
    kind: efs
    import: evolvingfuzzysystems.eFS:ePL
    safe_wrapper: false
    
  ePL_plus:
    kind: efs
    import: evolvingfuzzysystems.eFS:ePL_plus
    
  exTS:
    kind: efs
    import: evolvingfuzzysystems.eFS:exTS
    
  Simpl_eTS:
    kind: efs
    import: evolvingfuzzysystems.eFS:Simpl_eTS
    
  eMG:
    kind: efs
    import: evolvingfuzzysystems.eFS:eMG


datasets:
  Elec2_real:
    type: real
    class_name: Elec2
    lengths: {prelim: 3000, complete: 10000}
    
  CreditCard_real:
    type: real
    class_name: CreditCard
    lengths: {prelim: 3000, complete: 5000}
    
  Phishing_real:
    type: real
    class_name: Phishing
    lengths: {prelim: 3000, complete: 5000}
    
  Bananas_real:
    type: real
    class_name: Bananas
    lengths: {prelim: 3000, complete: 5000}
    
  ImageSegments_real:
    type: real
    class_name: ImageSegments
    lengths: {prelim: 3000, complete: 5000}
    
  Agrawal_synth:
    type: synth
    generator: Agrawal
    params: {seed: 42}
    lengths: {prelim: 5000, complete: 20000}
    
  ConceptDrift_Agrawal:
    type: synth
    generator: ConceptDriftStream
    params: {seed: 42, position: 2500, width: 1000}
    stream:
      generator: Agrawal
      params: {seed: 1, classification_function: 0}
    drift_stream:
      generator: Agrawal
      # Change classification_function: 1 for a genuine concept change.
      # The default below keeps the original scripts' class function.
      params: {seed: 2, classification_function: 0}
    drift_markers: {points: [2500], width: 1000}
    lengths: {prelim: 3000, complete: 20000}
    
  RandomRBFDrift_synth:
    type: synth
    generator: RandomRBFDrift
    # The original script used change_speed=0.0 (no actual drift).
    # Choose >0 for a genuine drift experiment; freeze before comparing.
    params: {seed: 42, change_speed: 0.0}
    lengths: {prelim: 5000, complete: 20000}
    
  Sine_synth:
    type: synth
    generator: Sine
    params: {seed: 42}
    lengths: {prelim: 5000, complete: 40000}


experiments:
  sota_comparison:
    models: [ENF_Unim_Safe, ENF_Unim_Safe_Local, ENF_Unim_PA]
    datasets: [Elec2_real, Bananas_real, ConceptDrift_Agrawal, Sine_synth]
    metrics: [Accuracy, Macro-F1]

  ablation:
    models: [ENF_Unim_Safe, ENF_Unim_PA, ENF_Unim_Safe_Local]
    datasets: [Elec2_real, Bananas_real, ConceptDrift_Agrawal, Sine_synth]
    ablations: [FULL, FIXED_AND, FIXED_OR, FIXED_COMP, NO_W]
    metrics: [Accuracy, Macro-F1]


plotting:
  overleaf_text_width_pt: 516
  overleaf_font_size: 11
  default_dpi: 300
  colours:
